[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-simsimd"
version = "0.1.0"
description = "Mojo SIMD distance kernels with a simsimd-compatible Python API"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["python"]
